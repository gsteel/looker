name: "Rector"
permissions: { }

# Prevent the workflow from running concurrently on the same PR or ref
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  pull_request:
  push:
    branches:
    tags:

env:
  default_php: '8.4'
  php_extensions: mbstring,json

jobs:
  rector:
    name: Rector on Default PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ env.default_php }}
          extensions: ${{ env.php_extensions }}
          tools: composer
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - uses: ramsey/composer-install@4.0.0
        with:
          working-directory: tools/rector
      - run: tools/rector/vendor/bin/rector process --dry-run --output-format=github -c tools/rector/rector.php
