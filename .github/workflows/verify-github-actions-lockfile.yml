# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.

name: "Verify GitHub Actions Lockfile"

on:
  pull_request:
  push:
    branches:
    tags:

permissions:
  contents: read

# Prevent the workflow from running concurrently on the same PR or ref
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify GitHub Actions Lockfile"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock
      - run: gh actions-lock --verify
