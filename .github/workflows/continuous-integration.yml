name: "Continuous Integration"
permissions: {}

on:
  pull_request:
  push:
    branches:
    tags:

# Prevent the workflow from running concurrently on the same PR or ref
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  default_php: '8.4'
  php_extensions: 'bcmath intl'

jobs:
  matrix:
    name: Generate job matrix
    runs-on: ubuntu-latest
    permissions:
      checks: write # Creates checks
      contents: read
      statuses: write # Writes to statuses
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Gather CI configuration
        id: matrix
        uses: laminas/laminas-ci-matrix-action@v1.36

  qa:
    name: QA Checks
    needs: [ matrix ]
    runs-on: ${{ matrix.operatingSystem }}
    permissions:
      contents: read
      statuses: write # Writes to statuses?
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: laminas/laminas-continuous-integration-action@v1.49
        with:
          job: ${{ matrix.job }}

  psalm-security-report:
    name: "SA Security Report"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Uploads sarif reports

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.default_php }}
          extensions: ${{ env.php_extensions }}
      - uses: ramsey/composer-install@4.0.0
      - name: "Static Analysis"
        run: vendor/bin/mago analyse --reporting-target=stdout --reporting-format=sarif > results.sarif
      - name: "Upload Security Analysis results to GitHub"
        uses: github/codeql-action/upload-sarif@v4.39.5
        with:
          sarif_file: results.sarif
